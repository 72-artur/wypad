name: Codzienne okazje

on:
  schedule:
    # Czas UTC. 04:23 = 06:23 latem / 05:23 zimą. Drugi termin to zapas: GitHub bywa spóźniony
    # albo pomija uruchomienia; jeśli dzisiejsze okazje są już opublikowane, drugi przebieg nic nie robi.
    - cron: "23 4 * * *"
    - cron: "53 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Szukaj od nowa, nawet jeśli dzisiejsze okazje już są"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-search
  cancel-in-progress: false

jobs:
  search-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      WYPAD_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - name: Czy dzisiejsze okazje są już opublikowane?
        id: live
        run: |
          today=$(TZ=Europe/Warsaw date +%F)
          live=$(curl -fsSL "$WYPAD_SITE_URL/data/deals.json" 2>/dev/null \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('' if d.get('sample') else d.get('date',''))" 2>/dev/null || true)
          echo "Dziś: $today, na stronie: ${live:-brak}"
          if [ "$live" = "$today" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.live.outputs.done != 'true'

      - uses: actions/setup-python@v5
        if: steps.live.outputs.done != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Zainstaluj zależności
        if: steps.live.outputs.done != 'true'
        run: pip install -r pipeline/requirements.txt

      - name: Szukaj okazji
        if: steps.live.outputs.done != 'true'
        working-directory: pipeline
        # --skip-if-done: dane z dziś są już w repozytorium (np. wczoraj padła tylko publikacja) → nie pobieraj ponownie
        run: python -m wypad search --site ../site --state ../state ${{ inputs.force == true && '--force' || '--skip-if-done' }}

      - name: Zapisz wyniki w repozytorium
        if: steps.live.outputs.done != 'true'
        run: |
          git config user.name "wypad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/d state
          git diff --cached --quiet || git commit -m "Okazje z $(TZ=Europe/Warsaw date +%F)"
          git push

      - uses: actions/configure-pages@v5
        if: steps.live.outputs.done != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.live.outputs.done != 'true'
        with:
          path: site
      - id: deploy
        if: steps.live.outputs.done != 'true'
        uses: actions/deploy-pages@v4

      - name: Wyślij powiadomienia
        if: steps.live.outputs.done != 'true'
        working-directory: pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m wypad notify --site ../site
