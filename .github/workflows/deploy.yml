name: Publikacja strony

# Zmiany w wyglądzie aplikacji trafiają na stronę od razu, bez czekania na poranne wyszukiwanie.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "!site/data/**"
      - "!site/d/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
